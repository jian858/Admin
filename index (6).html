<!DOCTYPE html>
<!--
  RULES FOR CHANGING THIS CODE
  RULE 1: before you add a feature, clean up the code it touches.
          (Tidy the functions, names and messy parts the new feature will use first. Then add the feature on top of clean code.)
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Murmur Admin</title>
<!--
  MURMUR ADMIN  -  admin.html  (its own page, same Firebase project as the app)
  Put it next to your app file. Open it, log in with an admin account.
  An account is an admin when  admins/<its uid> = true  in your Realtime Database.
  Tabs: Overview, Reports, Users, Posts, Announce.
-->
<style>
/* Same design as the Murmur app: teal accent, white header + tab bar, rounded cards, pill buttons. */
:root { --bg: #e9edf2; --ink: #14213d; --muted: #6a778c; --line: rgba(20,33,61,0.12); --acc: #14c8a0; --acc-strong: #0fae8a; --on: #04261e; --danger: #b3261e; --card: #ffffff; --soft: #e8ecf1; --field: rgba(255,255,255,0.7); --shadow: 0 20px 50px rgba(14,32,46,0.12); color-scheme: light; }
html[data-theme="dark"] { --bg: #121820; --ink: #e9eef6; --muted: #a3b0c4; --line: rgba(255,255,255,0.12); --card: #1c2430; --soft: #2a3442; --field: #2a3442; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: linear-gradient(180deg, #dff8f0 0%, var(--bg) 26%, #eef3f8 100%); color: var(--ink); }
html[data-theme="dark"] body { background: var(--bg); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

/* login */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.gate form { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; padding: 24px; background: rgba(255,255,255,0.72); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
html[data-theme="dark"] .gate form { background: rgba(28,36,48,0.85); }
.gate .logo { margin: 0; font-size: 2.6rem; font-weight: 800; letter-spacing: -0.06em; color: var(--acc-strong); line-height: 1; }
.gate .sub { margin: 0 0 8px; color: var(--muted); font-weight: 600; }
.gate input[type="email"], .gate input[type="password"], .gate input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 12px; padding: 10px 12px; color: var(--ink); outline: none; transition: border .2s ease, box-shadow .2s ease; }
.gate input:focus { border-color: var(--acc); box-shadow: 0 0 0 4px rgba(20,200,160,0.12); }
.gate .show { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
.gate .err { color: var(--danger); min-height: 1.2em; font-size: 0.9rem; overflow-wrap: anywhere; user-select: text; }
.gate button[type="submit"], .gate #go { border: 0; border-radius: 999px; padding: 11px 12px; font-weight: 700; background: var(--acc); color: var(--on); transition: transform .2s ease, opacity .2s ease; }
.gate button:active { transform: scale(0.98); }
.gate button:disabled { opacity: 0.6; }

/* panel */
.adm { position: fixed; inset: 0; z-index: 400; display: flex; flex-direction: column; color: var(--ink); background: linear-gradient(180deg, #dff8f0 0%, var(--bg) 26%, #eef3f8 100%); padding-top: env(safe-area-inset-top, 0px); }
html[data-theme="dark"] .adm { background: var(--bg); }
.adm-top { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--card); box-shadow: 0 1px 0 var(--line); }
.adm-logo { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.06em; color: var(--acc-strong); line-height: 1.2; }
.adm-badge { padding: 3px 10px; border-radius: 999px; background: rgba(20,200,160,0.14); color: var(--acc-strong); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
.adm-top .adm-btn { margin-left: auto; }
.adm-tabs { display: flex; border-top: 1px solid var(--line); background: var(--card); overflow-x: auto; }
.adm-tabs button { flex: 1 0 auto; min-width: 64px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 54px; padding: 0 10px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font-size: 0.72rem; font-weight: 700; }
.adm-tabs button.on { color: var(--acc-strong); border-bottom-color: var(--acc-strong); }
.adm-tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.adm-tabs .adm-badge-n { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 0.7rem; font-style: normal; display: grid; place-items: center; }
.adm-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 12px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: 760px; width: 100%; margin: 0 auto; }
.adm-card, .adm-stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.adm-card { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.adm-card p { margin: 0; overflow-wrap: anywhere; }
.adm-card small, .adm-muted { color: var(--muted); }
.adm-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.adm-row > .adm-grow { flex: 1; min-width: 0; }
.adm-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.adm-stat { padding: 16px; }
.adm-stat b { display: block; font-size: 1.8rem; color: var(--acc-strong); }
.adm-btn { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; background: var(--soft); color: var(--ink); transition: transform .2s ease, opacity .2s ease, background .2s ease; }
.adm-btn:active { transform: scale(0.96); }
.adm-btn.blue { background: var(--acc); color: var(--on); }
.adm-btn.red { background: var(--danger); color: #fff; }
.adm-in { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 12px; padding: 10px 12px; color: var(--ink); outline: none; transition: border .2s ease, box-shadow .2s ease; }
.adm-in:focus { border-color: var(--acc); box-shadow: 0 0 0 4px rgba(20,200,160,0.12); }
textarea.adm-in { min-height: 90px; resize: vertical; }
.adm-tag { display: inline-block; border-radius: 999px; padding: 2px 10px; background: var(--soft); font-size: 0.76rem; font-weight: 700; }
.adm-tag.red { background: rgba(179,38,30,0.12); color: var(--danger); }
.adm-msg { padding: 10px 14px; border-radius: 12px; background: rgba(20,200,160,0.12); color: var(--ink); font-size: 0.9rem; }
.adm-top [data-act="close"] { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .adm { animation: admIn .3s ease-out both; }
  .adm[data-anim] .adm-card, .adm[data-anim] .adm-stat { animation: rowIn .34s cubic-bezier(.2,.8,.2,1) both; }
  .adm-tabs button, .adm-tabs svg { transition: color .22s ease, border-color .22s ease, transform .25s cubic-bezier(.3,1.5,.5,1); }
  .adm-tabs button.on svg { transform: scale(1.12); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes admIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
}
</style>
<script>try { var t = localStorage.getItem('murmur-theme'); document.documentElement.dataset.theme = (t === 'dark' || t === 'light') ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}</script>

<body>
<div class="gate" id="gate">
  <form id="loginForm">
    <div class="logo">murmur</div>
    <p class="sub">Admin backend</p>
    <input id="email" type="email" placeholder="Admin email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" value="jiancarlopadua9@gmail.com" required />
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required />
    <label class="show"><input type="checkbox" id="showPass" /> Show password</label>
    <noscript><div class="err">JavaScript is turned off, so the login cannot work. Open this file in your normal browser.</div></noscript>

    <button type="submit" id="go">Log in</button>

</div>

<script>
/* ---------- real Firebase sign-in (no SDK needed) ----------
   Your admin account is the Firebase email/password account below. Every database request carries its
   token, so the database rules (database.rules.json) can tell it is really you. */
var API_KEY = 'AIzaSyBRjnlDgDmLRkVncPYx34eNdYMI48L7q1M', ADMIN_EMAIL = 'jiancarlopadua9@gmail.com', IDT = 'https://identitytoolkit.googleapis.com/v1/accounts:';
var AUTH = { token: '', refresh: '', exp: 0 };
function authCall(url, body) {
  return fetch(url + '?key=' + API_KEY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || 'error'); return j; }); });
}
function adopt(j) {
  AUTH.token = j.idToken || j.id_token; AUTH.refresh = j.refreshToken || j.refresh_token;
  AUTH.exp = Date.now() + (Number(j.expiresIn || j.expires_in || 3600) - 120) * 1000;
  try { localStorage.setItem('murmur-admin-rt', AUTH.refresh); } catch (e) {}
}
function refreshToken() {
  return fetch('https://securetoken.googleapis.com/v1/token?key=' + API_KEY, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(AUTH.refresh) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error('session expired'); adopt(j); return AUTH.token; }); });
}
function getToken() { return !AUTH.token ? Promise.resolve('') : (Date.now() < AUTH.exp ? Promise.resolve(AUTH.token) : refreshToken()); }

/* ---------- database over plain web requests (no Firebase SDK, so it works from any address) ---------- */
(function () {
  var BASE = 'https://murmur-fc430-default-rtdb.firebaseio.com';
  var TS = function (v) { return JSON.parse(JSON.stringify(v, function (k, x) { return x && x.__ts ? { '.sv': 'timestamp' } : x; })); };
  function call(method, path, body) {
    return getToken().then(function (t) {
      return fetch(BASE + '/' + path + '.json' + (t ? '?auth=' + encodeURIComponent(t) : ''), { method: method, body: body === undefined ? undefined : JSON.stringify(TS(body)) });
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'permission denied (check your database rules)' : 'database error ' + r.status);
      return r.json();
    });
  }
  window.__fb = {
    getDatabase: function () { return {}; },
    ref: function (_d, p) { return { path: String(p || '').split('/').filter(Boolean).join('/') }; },
    serverTimestamp: function () { return { __ts: 1 }; },
    set: function (r, v) { return call('PUT', r.path, v); },
    remove: function (r) { return call('DELETE', r.path); },
    get: function (r) { return call('GET', r.path); },
    beacon: function (path, v) { try { fetch(BASE + '/' + path + '.json' + (AUTH.token ? '?auth=' + encodeURIComponent(AUTH.token) : ''), { method: 'PUT', body: JSON.stringify(TS(v)), keepalive: true }); } catch (e) {} },
    push: function (r, v) { return call('POST', r.path, v); },
    onValue: function (r, cb, err) {            /* checks again every 4 seconds while the panel is open */
      var stop = false, last;
      function tick() {
        call('GET', r.path).then(function (v) { var j = JSON.stringify(v); if (j !== last) { last = j; cb({ val: function () { return v; } }); } }, function (e) { if (err) err(e); }).then(function () { if (!stop) setTimeout(tick, 4000); });
      }
      tick();
      return function () { stop = true; };
    }
  };
})();

(function () {
  const F = window.__fb;
  if (!F) return;
  const { ref, onValue, set, remove, push, serverTimestamp } = F, db = F.getDatabase();
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ago = t => { if (!t) return ''; const m = Math.round((Date.now() - t) / 6e4); return m < 1 ? 'now' : m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };
  const KEYS = { users: 'users', posts: 'posts', reports: 'reports', ann: 'announcements', reels: 'reels', appeals: 'appeals', deleted: 'deletedAccounts', log: 'auditLog', status: 'adminStatus', susp: 'suspended', stories: 'stories', notes: 'notes' };
  const ICONS = { overview: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>', reports: '<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14c2.8 0 4.7 1.8 4.7 4.5"/>', posts: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>', ann: '<path d="M4 10v4h3l8 4V6L7 10z"/><path d="M18 9a4 4 0 0 1 0 6"/>', appeals: '<path d="M4 5h16v11H9l-5 4z"/>', deleted: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', log: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', reels: '<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M10 9l5 3-5 3z"/>' };
  const TABS = [['overview', 'Overview'], ['reports', 'Reports'], ['users', 'Users'], ['appeals', 'Appeals'], ['deleted', 'Deleted'], ['posts', 'Posts'], ['reels', 'Reels'], ['log', 'Activity'], ['ann', 'Announce']];
  let D = {}, subs = [], el = null, tab = 'overview', q = '', armed = '', armT = null, suspUid = '', suspWhy = '', suspMode = 'susp', replyDraft = {}, msg = '';
  let draft = { title: '', body: '', kind: 'info', pin: false, hrs: '0' };

  const fmt = c => (c || '').replace(/(.{4})(?=.)/g, '$1-');
  const nm = u => (D.users && D.users[u] && D.users[u].name) || 'Unknown';
  const entries = k => Object.entries(D[k] || {});
  const count = k => entries(k).length;
  const btn = (cls, act, id, label, key) => `<button type="button" class="adm-btn ${cls}" data-act="${act}" data-id="${esc(id)}">${armed === (act + id) ? 'Tap again to confirm' : label}</button>`;

  async function run(fn, ok) { try { await fn(); msg = ok || 'Done.'; } catch (e) { msg = 'Could not do that: ' + ((e && e.message) || 'permission denied'); } render(); }
  const delPost = id => Promise.all([remove(ref(db, 'posts/' + id)), remove(ref(db, 'comments/' + id))]);
  const read = p => F.get(ref(db, p));
  const logAct = (action, uid, reason) => push(ref(db, 'auditLog'), { action, uid, name: nm(uid), reason: reason || '', at: serverTimestamp() });
  const suspend = async (uid, why) => { const reason = (why || '').trim().slice(0, 120) || 'You broke the Murmur rules.'; await set(ref(db, 'suspended/' + uid), { reason, createdAt: serverTimestamp() }); await logAct('suspend', uid, reason); };
  /* delete = soft delete: everything is saved in deletedAccounts/<uid> so it can be recovered */
  async function deleteAccount(uid, why) {
    const reason = (why || '').trim().slice(0, 120), u = (D.users || {})[uid] || {}, pr = await read('profiles/' + uid).catch(() => null), posts = {};
    entries('posts').forEach(([id, p]) => { if (p.authorUid === uid) posts[id] = p; });
    await set(ref(db, 'deletedAccounts/' + uid), { name: u.name || nm(uid), username: u.username || '', reason, deletedAt: serverTimestamp(), status: 'deleted', profile: pr || null, posts });
    await set(ref(db, 'suspended/' + uid), { reason, deleted: true, createdAt: serverTimestamp() });
    await Promise.all([remove(ref(db, 'profiles/' + uid)), remove(ref(db, 'stories/' + uid)), remove(ref(db, 'notes/' + uid))].concat(Object.keys(posts).map(delPost)));
    await logAct('delete', uid, reason);
  }
  /* every user's 16-character ID lives only in the database: users/<uid>/code, profiles/<uid>/code and the list codes/<ID> */
  async function createMissingIds() {
    const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let made = 0;
    for (const [uid, u] of entries('users')) {
      if (u.code || ((D.deleted || {})[uid] || {}).status === 'deleted') continue;
      for (let i = 0; i < 6; i++) {
        const code = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => LETTERS[b % 32]).join('');
        if (await read('codes/' + code)) continue;
        await set(ref(db, 'codes/' + code), uid);
        await set(ref(db, 'users/' + uid + '/code'), code);
        made++; break;
      }
    }
    return made;
  }
  const missingIdsCard = () => { const n = entries('users').filter(([id, u]) => !u.code && ((D.deleted || {})[id] || {}).status !== 'deleted').length; return n ? `<div class="adm-card"><div class="adm-row"><b class="adm-grow">${n} user${n === 1 ? ' has' : 's have'} no ID yet</b><button type="button" class="adm-btn blue" data-act="mkcodes">Create IDs</button></div></div>` : ''; };
  async function recoverAccount(uid) {
    const d = (D.deleted || {})[uid]; if (!d) return;
    const w = [remove(ref(db, 'suspended/' + uid)), set(ref(db, 'deletedAccounts/' + uid + '/status'), 'recovered'), set(ref(db, 'deletedAccounts/' + uid + '/recoveredAt'), serverTimestamp())];
    if (d.profile) w.push(set(ref(db, 'profiles/' + uid), d.profile));
    Object.entries(d.posts || {}).forEach(([id, p]) => w.push(set(ref(db, 'posts/' + id), p)));
    await Promise.all(w); await logAct('recover', uid, '');
  }
  async function decideAppeal(uid, ok) {
    const a = (D.appeals || {})[uid]; if (!a) return;
    const reply = (replyDraft[uid] || '').trim().slice(0, 160), dl = (D.deleted || {})[uid];
    if (ok) { if (dl && dl.status === 'deleted') await recoverAccount(uid); else await remove(ref(db, 'suspended/' + uid)); }
    await set(ref(db, 'appeals/' + uid), Object.assign({}, a, { status: ok ? 'approved' : 'declined', reply, decidedAt: serverTimestamp() }));
    delete replyDraft[uid]; await logAct(ok ? 'appeal-approved' : 'appeal-declined', uid, reply);
  }
  const tabBadge = t => t === 'reports' ? count('reports') : t === 'appeals' ? entries('appeals').filter(([, a]) => a.status === 'open').length : 0;

  function view() {
    if (tab === 'overview') {
      const open = count('reports'), stories = Object.values(D.stories || {}).reduce((n, o) => n + Object.keys(o || {}).length, 0);
      const on = D.status && D.status.online && Date.now() - (D.status.lastSeen || 0) < 90000;
      return `<div class="adm-card"><div class="adm-row"><b class="adm-grow">Admin status</b><span class="adm-tag${on ? '' : ' red'}">${on ? 'Online' : 'Offline'}</span></div><small>${on ? 'Saved: you are online as admin.' : 'Last seen ' + (D.status && D.status.lastSeen ? ago(D.status.lastSeen) + ' ago' : 'never')}</small></div><div class="adm-stats">${[['Users', count('users')], ['Posts', count('posts')], ['Open reports', open], ['Suspended', count('susp')], ['Stories live', stories], ['Notes', count('notes')], ['Open appeals', tabBadge('appeals')], ['Deleted accounts', entries('deleted').filter(([, d]) => d.status === 'deleted').length]].map(s => `<div class="adm-stat"><b>${s[1]}</b><span class="adm-muted">${s[0]}</span></div>`).join('')}</div>`;
    }
    if (tab === 'reports') {
      const list = entries('reports').sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
      return list.length ? list.map(([id, r]) => {
        const isPost = r.type === 'post', post = isPost ? (D.posts || {})[r.targetId] : null, uid = isPost ? (post && post.authorUid) : r.targetId;
        return `<div class="adm-card"><div class="adm-row"><span class="adm-tag red">${esc(r.type || 'report')}</span><b class="adm-grow">${esc(r.reason || 'No reason')}</b><small>${ago(r.createdAt)}</small></div>
          <p>${isPost ? (post ? esc(post.text) : '<span class="adm-muted">Post already removed</span>') : esc(r.targetName || nm(r.targetId))}</p>
          <small>Reported by ${esc(nm(r.by))}${uid ? ' · about ' + esc(nm(uid)) : ''}</small>
          <div class="adm-row">${isPost && post ? btn('red', 'delpost', r.targetId, 'Delete post') : ''}${uid && !(D.susp || {})[uid] ? `<button type="button" class="adm-btn" data-act="asksusp" data-id="${esc(uid)}">Suspend user</button>` : ''}${btn('', 'dismiss', id, 'Dismiss')}</div>${suspUid && suspUid === uid ? suspForm() : ''}</div>`;
      }).join('') : '<p class="adm-muted">No reports. Nice and quiet.</p>';
    }
    if (tab === 'users') {
      const s = q.trim().toLowerCase();
      const list = entries('users').filter(([, u]) => !s || ((u.name || '') + ' ' + (u.username || '') + ' ' + (u.code || '') + ' ' + fmt(u.code)).toLowerCase().includes(s)).sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));
      return missingIdsCard() + `<input class="adm-in" data-q placeholder="Search name, @username or 16-character ID" value="${esc(q)}" />` + (list.map(([uid, u]) => {
        const sus = (D.susp || {})[uid], st = (D.stories || {})[uid], dl = (D.deleted || {})[uid], isDel = dl && dl.status === 'deleted';
        return `<div class="adm-card"><div class="adm-row"><div class="adm-grow"><b>${esc(u.name || 'Unknown')}</b><br /><small>${esc(u.username || '')}${u.code ? ' · ID ' + fmt(u.code) : ''}</small></div>${isDel ? '<span class="adm-tag red">Deleted</span>' : sus ? '<span class="adm-tag red">Suspended</span>' : ''}</div>
          ${(D.notes || {})[uid] ? `<p><small>Note:</small> ${esc(D.notes[uid].text)}</p>` : ''}
          <div class="adm-row">${isDel ? btn('blue', 'recover', uid, 'Recover account') : (sus ? btn('blue', 'unsusp', uid, 'Unsuspend') : `<button type="button" class="adm-btn" data-act="asksusp" data-id="${esc(uid)}">Suspend</button>`) + `<button type="button" class="adm-btn red" data-act="askdel" data-id="${esc(uid)}">Delete account</button>`}${(D.notes || {})[uid] ? btn('', 'delnote', uid, 'Remove note') : ''}${st && Object.keys(st).length ? btn('', 'delstories', uid, 'Clear stories') : ''}</div>${suspUid === uid ? suspForm() : ''}</div>`;
      }).join('') || '<p class="adm-muted">No users found.</p>');
    }
    if (tab === 'appeals') {
      const list = entries('appeals').sort((a, b) => (a[1].status === 'open' ? 0 : 1) - (b[1].status === 'open' ? 0 : 1) || (b[1].createdAt || 0) - (a[1].createdAt || 0));
      return list.length ? list.map(([uid, a]) => {
        const dl = (D.deleted || {})[uid], isDel = dl && dl.status === 'deleted', sus = (D.susp || {})[uid], why = isDel ? dl.reason : sus ? sus.reason : (a.reason || '');
        return `<div class="adm-card"><div class="adm-row"><b class="adm-grow">${esc(a.name || nm(uid))}</b><span class="adm-tag${a.status === 'open' ? ' red' : ''}">${esc(a.status || 'open')}</span><small>${ago(a.createdAt)}</small></div>
          <small>${isDel ? 'Account deleted' : 'Suspended'} for: ${esc(why || 'No reason saved')}</small><p>${esc(a.message)}</p>${a.reply ? `<small>Your reply: ${esc(a.reply)}</small>` : ''}
          ${a.status === 'open' ? `<input class="adm-in" data-reply="${esc(uid)}" maxlength="160" placeholder="Reply to the user (optional)" value="${esc(replyDraft[uid] || '')}" /><div class="adm-row"><button type="button" class="adm-btn blue" data-act="approve" data-id="${esc(uid)}">Approve${isDel ? ' + recover' : ''}</button><button type="button" class="adm-btn red" data-act="decline" data-id="${esc(uid)}">Decline</button></div>` : ''}</div>`;
      }).join('') : '<p class="adm-muted">No appeals.</p>';
    }
    if (tab === 'deleted') {
      const list = entries('deleted').sort((a, b) => (b[1].deletedAt || 0) - (a[1].deletedAt || 0));
      return list.length ? list.map(([uid, d]) => `<div class="adm-card"><div class="adm-row"><div class="adm-grow"><b>${esc(d.name)}</b><br /><small>${esc(d.username)}</small></div><span class="adm-tag${d.status === 'deleted' ? ' red' : ''}">${esc(d.status)}</span></div><p><small>Reason:</small> ${esc(d.reason)}</p><small>Deleted ${ago(d.deletedAt) === 'now' ? 'just now' : ago(d.deletedAt) + ' ago'} · ${Object.keys(d.posts || {}).length} posts saved${d.status === 'recovered' ? ' · recovered ' + (ago(d.recoveredAt) === 'now' ? 'just now' : ago(d.recoveredAt) + ' ago') : ''}</small>${d.status === 'deleted' ? `<div class="adm-row">${btn('blue', 'recover', uid, 'Recover account')}</div>` : ''}</div>`).join('') : '<p class="adm-muted">No deleted accounts.</p>';
    }
    if (tab === 'log') {
      const L = { delete: 'Deleted account', recover: 'Recovered account', suspend: 'Suspended', unsuspend: 'Unsuspended', 'appeal-approved': 'Appeal approved', 'appeal-declined': 'Appeal declined' };
      const list = entries('log').sort((a, b) => (b[1].at || 0) - (a[1].at || 0)).slice(0, 100);
      return list.length ? list.map(([, l]) => `<div class="adm-card"><div class="adm-row"><b class="adm-grow">${esc(L[l.action] || l.action)}</b><small>${ago(l.at)}</small></div><p>${esc(l.name || nm(l.uid))}</p>${l.reason ? `<small>Reason: ${esc(l.reason)}</small>` : ''}</div>`).join('') : '<p class="adm-muted">No activity yet.</p>';
    }
    if (tab === 'reels') {
      const list = entries('reels').sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
      return list.length ? list.map(([id, r]) => `<div class="adm-card"><div class="adm-row"><b class="adm-grow">${esc(r.authorName || nm(r.authorUid))}</b><small>${ago(r.createdAt)}</small></div><p>${esc(r.caption || '(no caption)')}</p><small>${esc(r.url)}</small><div class="adm-row">${btn('red', 'delreel', id, 'Delete reel')}</div></div>`).join('') : '<p class="adm-muted">No reels yet.</p>';
    }
    if (tab === 'posts') {
      const list = entries('posts').sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
      return list.length ? list.map(([id, p]) => `<div class="adm-card"><div class="adm-row"><b class="adm-grow">${esc(p.authorName || nm(p.authorUid))}</b><span class="adm-tag">${esc(p.audience || 'public')}</span><small>${ago(p.createdAt)}</small></div><p>${esc(p.text)}</p><div class="adm-row">${btn('red', 'delpost', id, 'Delete post')}</div></div>`).join('') : '<p class="adm-muted">No posts yet.</p>';
    }
    const list = entries('ann').sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    return `<div class="adm-card"><b>New announcement</b><input class="adm-in" data-d="title" maxlength="60" placeholder="Title" value="${esc(draft.title)}" /><textarea class="adm-in" data-d="body" maxlength="240" rows="3" placeholder="Message sent to everyone's Alerts (from Admin of Murmur)">${esc(draft.body)}</textarea>
      <div class="adm-row"><select class="adm-in adm-grow" data-d="kind"><option value="info"${draft.kind === 'info' ? ' selected' : ''}>Info</option><option value="warn"${draft.kind === 'warn' ? ' selected' : ''}>Warning</option></select><select class="adm-in adm-grow" data-d="hrs">${[['0', 'No expiry'], ['24', '24 hours'], ['168', '7 days']].map(o => `<option value="${o[0]}"${draft.hrs === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></div>
      <label class="adm-row"><input type="checkbox" data-d="pin"${draft.pin ? ' checked' : ''} /> Pin to the top</label><button type="button" class="adm-btn blue" data-act="postann">Publish</button></div>`
      + list.map(([id, a]) => `<div class="adm-card"><div class="adm-row"><b class="adm-grow">${esc(a.title)}</b>${a.pinned ? '<span class="adm-tag">Pinned</span>' : ''}<small>${ago(a.createdAt)}</small></div><p>${esc(a.body)}</p><div class="adm-row">${btn('red', 'delann', id, 'Delete')}</div></div>`).join('');
  }
  function suspForm() { return `<div class="adm-row"><input class="adm-in adm-grow" data-why placeholder="Reason (shown to the user, who can appeal)" maxlength="120" value="${esc(suspWhy)}" /><button type="button" class="adm-btn red" data-act="dosusp">${suspMode === 'del' ? 'Delete account' : 'Suspend'}</button><button type="button" class="adm-btn" data-act="nosusp">Cancel</button></div>`; }

  function render() {
    if (!el) return;
    const keep = document.activeElement && (document.activeElement.matches && document.activeElement.matches('[data-q],[data-why],[data-d],[data-reply]')) ? document.activeElement : null;
    const kd = keep && (keep.dataset.q !== undefined ? '[data-q]' : keep.dataset.why !== undefined ? '[data-why]' : keep.dataset.reply ? '[data-reply="' + keep.dataset.reply + '"]' : '[data-d="' + keep.dataset.d + '"]');
    el.querySelector('.adm-tabs').innerHTML = TABS.map(t => `<button type="button" data-tab="${t[0]}" class="${tab === t[0] ? 'on' : ''}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[t[0]]}</svg>${t[1]}${tabBadge(t[0]) ? '<i class="adm-badge-n">' + tabBadge(t[0]) + '</i>' : ''}</button>`).join('');
    el.querySelector('.adm-body').innerHTML = (msg ? `<div class="adm-msg">${esc(msg)}</div>` : '') + view();
    if (kd) { const n = el.querySelector(kd); if (n && n.type !== 'checkbox' && n.tagName !== 'SELECT') { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) {} } }
  }
  function arm(key) { if (armed === key) { armed = ''; clearTimeout(armT); return true; } armed = key; clearTimeout(armT); armT = setTimeout(() => { armed = ''; render(); }, 3500); render(); return false; }

  function openAdmin() {
    if (el) return;
    el = document.createElement('div'); el.className = 'adm'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Admin panel');
    el.innerHTML = '<div class="adm-top"><button type="button" data-act="close" aria-label="Close" hidden></button><span class="adm-logo">murmur</span><span class="adm-badge">Admin</span></div><div class="adm-tabs"></div><div class="adm-body"></div>';
    document.body.appendChild(el); tab = 'overview'; msg = ''; D = {};
    Object.entries(KEYS).forEach(([k, p]) => subs.push(onValue(ref(db, p), s => { D[k] = s.val() || {}; render(); }, () => {})));
    render();
    el.addEventListener('click', e => {
      const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; msg = ''; el.dataset.anim = '1'; clearTimeout(openAdmin.t); openAdmin.t = setTimeout(() => { if (el) delete el.dataset.anim; }, 700); render(); return; }
      const b = e.target.closest('[data-act]'); if (!b) return;
      const a = b.dataset.act, id = b.dataset.id;
      if (a === 'close') { subs.forEach(u => u()); subs = []; el.remove(); el = null; return; }
      if (a === 'asksusp') { suspUid = id; suspWhy = ''; suspMode = 'susp'; render(); return; }
      if (a === 'mkcodes') { run(async () => { await createMissingIds(); }, 'IDs created for the users who had none.'); return; }
      if (a === 'askdel') { suspUid = id; suspWhy = ''; suspMode = 'del'; render(); return; }
      if (a === 'recover') { run(() => recoverAccount(id), nm(id) + ' was recovered.'); return; }
      if (a === 'approve') { run(() => decideAppeal(id, true), 'Appeal approved.'); return; }
      if (a === 'decline') { run(() => decideAppeal(id, false), 'Appeal declined.'); return; }
      if (a === 'nosusp') { suspUid = ''; render(); return; }
      if (a === 'dosusp') {
        if (!suspWhy.trim()) { msg = 'Write a reason first. The user will see it and can appeal.'; render(); return; }
        const u = suspUid, w = suspWhy, m = suspMode; suspUid = '';
        run(() => m === 'del' ? deleteAccount(u, w) : suspend(u, w), m === 'del' ? nm(u) + ' was deleted. You can recover it in the Deleted tab.' : nm(u) + ' is suspended.'); return;
      }
      if (a === 'postann') {
        if (!draft.title.trim() || !draft.body.trim()) { msg = 'Add a title and a message.'; render(); return; }
        const d = draft, hrs = +d.hrs; draft = { title: '', body: '', kind: 'info', pin: false, hrs: '0' };
        run(() => push(ref(db, 'announcements'), { title: d.title.trim().slice(0, 60), body: d.body.trim().slice(0, 240), kind: d.kind, pinned: d.pin, createdAt: serverTimestamp(), ...(hrs ? { expiresAt: Date.now() + hrs * 36e5 } : {}) }), 'Announcement published.'); return;
      }
      if (a === 'unsusp') { run(async () => { await remove(ref(db, 'suspended/' + id)); await logAct('unsuspend', id, ''); }, nm(id) + ' can use Murmur again.'); return; }
      if (!arm(a + id)) return;
      if (a === 'delpost') run(() => delPost(id), 'Post deleted.');
      else if (a === 'dismiss') run(() => remove(ref(db, 'reports/' + id)), 'Report dismissed.');
      else if (a === 'delnote') run(() => remove(ref(db, 'notes/' + id)), 'Note removed.');
      else if (a === 'delstories') run(() => remove(ref(db, 'stories/' + id)), 'Stories cleared.');
      else if (a === 'delreel') run(() => remove(ref(db, 'reels/' + id)), 'Reel deleted.');
      else if (a === 'delann') run(() => remove(ref(db, 'announcements/' + id)), 'Announcement deleted.');
    });
    el.addEventListener('input', e => {
      const t = e.target;
      if (t.dataset.q !== undefined) { q = t.value; render(); }
      else if (t.dataset.why !== undefined) suspWhy = t.value;
      else if (t.dataset.reply) replyDraft[t.dataset.reply] = t.value;
      else if (t.dataset.d) draft[t.dataset.d] = t.type === 'checkbox' ? t.checked : t.value;
    });
    el.addEventListener('change', e => { const t = e.target; if (t.dataset.d) draft[t.dataset.d] = t.type === 'checkbox' ? t.checked : t.value; });
  }

  window.openMurmurAdmin = openAdmin;
})();

var gate = document.getElementById('gate'), msg = document.getElementById('err'), go = document.getElementById('go');
var beat;
function saveStatus(online) {
  var v = { online: online, lastSeen: window.__fb.serverTimestamp() };
  if (online) window.__fb.set(window.__fb.ref(null, 'adminStatus'), v).catch(function () {});
  else window.__fb.beacon('adminStatus', v);
}
function goOnline() { saveStatus(true); clearInterval(beat); beat = setInterval(function () { saveStatus(true); }, 30000); }
function goOffline() { clearInterval(beat); saveStatus(false); }
document.addEventListener('visibilitychange', function () { if (!document.getElementById('adminOut')) return; if (document.hidden) goOffline(); else goOnline(); });
window.addEventListener('pagehide', function () { if (document.getElementById('adminOut')) goOffline(); });
function enter() {
  gate.hidden = true;
  window.openMurmurAdmin();
  goOnline();
  var top = document.querySelector('.adm-top');
  if (top && !document.getElementById('adminOut')) {
    var b = document.createElement('button');
    b.id = 'adminOut'; b.type = 'button'; b.className = 'adm-btn'; b.textContent = 'Sign out';
    b.onclick = function () { try { localStorage.removeItem('murmur-admin-rt'); } catch (e) {} goOffline(); setTimeout(function () { location.reload(); }, 250); };
    top.appendChild(b);
  }
}
document.getElementById('showPass').addEventListener('change', function (e) { document.getElementById('pass').type = e.target.checked ? 'text' : 'password'; });
function nice(e) {
  var m = String(e && e.message || e);
  return /EMAIL_EXISTS|INVALID_PASSWORD|INVALID_LOGIN/.test(m) ? 'Wrong password for this admin account.'
    : /OPERATION_NOT_ALLOWED/.test(m) ? 'Email/password login is off. Firebase console > Authentication > Sign-in method > Email/Password > Enable.'
    : /WEAK_PASSWORD/.test(m) ? 'Password must be at least 6 characters.'
    : /TOO_MANY/.test(m) ? 'Too many tries. Wait a few minutes.'
    : /Failed to fetch|NetworkError/.test(m) ? 'No internet connection.'
    : 'Could not log in. (' + m + ')';
}
async function signIn(email, pass) {
  var j;
  try { j = await authCall(IDT + 'signInWithPassword', { email: email, password: pass, returnSecureToken: true }); }
  catch (e) {
    if (!/EMAIL_NOT_FOUND|INVALID_LOGIN|INVALID_PASSWORD/.test(e.message)) throw e;
    j = await authCall(IDT + 'signUp', { email: email, password: pass, returnSecureToken: true });   // first time: creates the admin account
  }
  adopt(j);
}
document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault(); msg.textContent = ''; go.disabled = true;
  var em = document.getElementById('email').value.trim().toLowerCase();
  if (em !== ADMIN_EMAIL) { msg.textContent = 'This email is not the admin.'; go.disabled = false; return; }
  try { await signIn(em, document.getElementById('pass').value.trim()); enter(); }
  catch (x) { AUTH.token = ''; msg.textContent = nice(x); go.disabled = false; }
});
try {
  var rt = localStorage.getItem('murmur-admin-rt');
  if (rt) { AUTH.refresh = rt; refreshToken().then(enter, function () { try { localStorage.removeItem('murmur-admin-rt'); } catch (e) {} }); }
} catch (e) {}
</script>
</body>
