name: Validate Murmur Admin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
      - name: Validate local HTML assets and duplicate IDs
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const ids = [...html.matchAll(/\\bid=["']([^"']+)["']/g)].map((match) => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));
          for (const match of html.matchAll(/(?:src|href)=["'](\\.\\/[^"']+)["']/g)) {
            const path = match[1].split(/[?#]/, 1)[0];
            if (!existsSync(path)) throw new Error('Missing local asset: ' + path);
          }
          console.log('Admin HTML assets and IDs are valid.');
          NODE
